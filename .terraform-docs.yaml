# https://terraform-docs.io/user-guide/configuration/

formatter: "markdown" # this is required

version: "v0.20.0"

header-from: ".header.md"
footer-from: ""

recursive:
  enabled: false
  path: modules

sections:
  hide: []
  show: [all]

content: ""

output:
  file: "README.md"
  mode: replace
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

output-values:
  enabled: false
  from: ""

sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: true
  default: true
  description: false
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
